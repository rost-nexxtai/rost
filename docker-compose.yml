# Production stack, deployed with Dokploy (Docker Compose, compose path ./docker-compose.yml).
# Only the frontend is public: give it a domain in Dokploy's Domains tab (service "frontend", port 3000).
# It proxies /api/* to the backend over the internal network, so the backend and the database publish no ports.
# Secrets come from Dokploy's Environment tab, which Dokploy writes to .env next to this file. See .env.example.
# Locally, docker-compose.override.yml is merged in automatically: it publishes ports and turns the demo tools on.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rost}
    volumes:
      # A named volume, so Dokploy's Volume Backups can back it up.
      - rost-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    # Health: the image's HEALTHCHECK calls GET /healthz.
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      # POSTGRES_PASSWORD goes into a URL: keep it URL-safe (e.g. openssl rand -hex 24).
      DATABASE_URL: postgres://${POSTGRES_USER:-rost}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rost}?sslmode=disable
      # Stage helpers (demo partner token, app clock, demo reset). Set to true only for a demo.
      ALLOW_DEMO_TOKEN: ${ALLOW_DEMO_TOKEN:-false}
      POSTBACK_SECRET: ${POSTBACK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PAYSLIP_MODEL: ${PAYSLIP_MODEL:-}
      # Only the frontend reaches the API, behind Dokploy's proxy, which sets X-Forwarded-For: rate limits key on it.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RATE_LIMITS: ${RATE_LIMITS:-on}
      # First admin, created on start (both or neither).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
        # Browser security headers, fixed at build time. Partner origins allowed to frame the bank view
        # (/embed), space-separated; and HSTS=true once the domain is served over HTTPS.
        EMBED_FRAME_ANCESTORS: ${EMBED_FRAME_ANCESTORS:-}
        HSTS: ${HSTS:-false}
    environment:
      # Server components call the backend directly; the /api rewrite was fixed at build time.
      BACKEND_URL: http://backend:8080
      POSTBACK_SECRET: ${POSTBACK_SECRET:-}
    expose:
      - "3000"
    # Listed explicitly so the frontend keeps reaching the backend when Dokploy adds its own network for the domain.
    networks:
      - default
    # Health: the image's HEALTHCHECK loads the landing page.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rost-db:
