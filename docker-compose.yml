services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rost
      POSTGRES_PASSWORD: rost
      POSTGRES_DB: rost
    ports:
      - "5432:5432"
    volumes:
      - rost-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rost -d rost"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://rost:rost@db:5432/rost?sslmode=disable
      # Stage helpers (demo partner token, app clock, demo reset). Turn off outside the demo.
      ALLOW_DEMO_TOKEN: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rost-db:
