# Local development only. `docker compose up` merges this into docker-compose.yml automatically;
# Dokploy runs docker-compose.yml on its own, so none of this reaches production.

services:
  db:
    ports:
      - "5432:5432"

  backend:
    environment:
      ALLOW_DEMO_TOKEN: ${ALLOW_DEMO_TOKEN:-true}
      # plain http locally, and no proxy in front writing X-Forwarded-For
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "8080:8080"

  frontend:
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
