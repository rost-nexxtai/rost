name: ci
# Every push, on any branch, and every pull request.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          # The newest 1.26 patch, so govulncheck judges the standard library we would ship.
          check-latest: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test ./...
      - run: go test ./internal/store/
        env:
          ROST_TEST_DATABASE_URL: postgres://rost:rost@localhost:5432/rost?sslmode=disable
      - run: docker build -t rost-backend .
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rost
          POSTGRES_PASSWORD: rost
          POSTGRES_DB: rost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rost -d rost"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Known vulnerabilities in what ships (dependencies, not dev tools), high or critical.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
